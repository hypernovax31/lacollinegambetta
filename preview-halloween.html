<!DOCTYPE html>
<html lang="fr" class="fete-halloween-active">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu — décor Halloween (couverture &amp; carte)</title>
<style>
  :root { --ink:#24102e; --cream:#fcfbf7; --gold-500:#d8b257; --gold-100:#fef9db; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Montserrat',system-ui,sans-serif; background:var(--cream); color:var(--ink); }
  header { padding:22px 18px 10px; text-align:center; }
  header h1 { margin:0 0 6px; font-family:'Cinzel',serif; font-size:1.1rem; letter-spacing:.14em; text-transform:uppercase; }
  header p { margin:0; font-size:.82rem; line-height:1.5; color:#6e5468; }
  .maquettes { display:grid; gap:26px; padding:18px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  figure { margin:0; }
  figcaption { margin:0 0 8px; font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:#6e5468; }
  .maquette { position:relative; height:min(72vh,620px); overflow:hidden; border:1px solid rgba(216,178,87,.5); }
  /* ---- maquette de la couverture ---- */
  .maquette--cover { background:radial-gradient(circle at 50% 25%, #5f3477 0%, #432155 55%, #24102e 100%); display:grid; place-items:center; color:#fff; }
  .maquette--cover::after { content:''; position:absolute; inset:16px; border:1px solid rgba(216,178,87,.22); pointer-events:none; }
  .faux-titre { text-align:center; font-family:'Cinzel',serif; letter-spacing:.18em; text-transform:uppercase; }
  .faux-titre b { display:block; font-size:clamp(1.6rem,5vw,2.6rem); font-weight:400; }
  .faux-titre span { display:block; margin-top:.4rem; color:var(--gold-500); font-size:.62rem; letter-spacing:.3em; }
  .faux-medaillon { width:min(46%,240px); aspect-ratio:1; border-radius:50%; border:4px solid var(--gold-500); margin:14px auto 0; display:grid; place-items:center; font-family:'Cinzel',serif; letter-spacing:.2em; color:var(--gold-100); font-size:.8rem; }
  /* ---- maquette de la carte ---- */
  .maquette--menu { background:var(--cream); }
  .faux-nav { position:sticky; top:0; z-index:1000; display:flex; gap:6px; padding:10px; background:rgba(89,46,111,.96); color:#fff; font-size:.62rem; }
  .faux-nav span { flex:1; text-align:center; padding:6px 2px; border-radius:8px; background:rgba(255,255,255,.08); }
  .faux-nav span:nth-child(1) { background:rgba(216,178,87,.35); }
  .faux-grille { display:grid; gap:10px; padding:14px; }
  .faux-carte { border:1px solid rgba(36,16,46,.12); border-radius:12px; padding:10px 12px; background:#fff; }
  .faux-carte b { display:block; font-size:.8rem; }
  .faux-carte i { display:block; height:8px; margin-top:6px; border-radius:4px; background:rgba(36,16,46,.08); }
  .faux-carte i:nth-child(3) { width:62%; }
  /* ---- le décor lui-même (copié tel quel de index.html) ---- */
/* ===== Halloween : toiles d'araignée dans les angles (24 oct → 2 nov) =====
   Décor saisonnier piloté par la classe que pose assets/js/fetes-medaillon.js
   (html.fete-halloween-active) : aucun script de plus, aucun fichier à charger
   hors saison, aucun élément dans le flux (rien ne bouge à l'affichage).
   Aperçu toute l'année : ?halloween=1 — ou ?fete=halloween, ?fete=0 pour rien. */
.lcg-halloween-sprite { display:none; }
.lcg-halloween { display:none; }
html.fete-halloween-active .lcg-halloween {
  display:block;
  animation:lcg-halloween-apparait 1.6s ease both;
}
@keyframes lcg-halloween-apparait { from { opacity:0; } to { opacity:1; } }
.lcg-halloween { position:absolute; inset:0; z-index:1; pointer-events:none; }
.lcg-halloween--menu { position:fixed; }          /* suit le défilement de la carte */
.lcg-halloween--cover { color:rgba(252,251,247,.26); }   /* ivoire sur le violet de la couverture */
.lcg-halloween--menu { color:rgba(36,16,46,.18); }       /* encre sur le crème de la carte */
.lcg-halloween__toile,
.lcg-halloween__araignee {
  position:absolute; fill:none; stroke:currentColor;
  stroke-width:1.1; stroke-linecap:round;
}
.lcg-halloween__toile { width:clamp(92px,14vw,164px); aspect-ratio:1/1; }
.lcg-halloween__toile--hg { top:0; left:0; }
.lcg-halloween__toile--hd { top:0; right:0; transform:scaleX(-1); }
.lcg-halloween__toile--bg { bottom:0; left:0; transform:scaleY(-1); }
.lcg-halloween__toile--bd { bottom:0; right:0; transform:scale(-1,-1); }
.lcg-halloween__araignee { width:clamp(34px,4.6vw,52px); aspect-ratio:60/96; }
/* Une seule araignée, et une seule fois : elle descend de son fil en haut à
   gauche de la couverture. Dans la carte, le bandeau d'onglets collant occupe
   tout le haut de l'écran — elle attend donc le coin en bas à droite, son fil
   se perdant dans la toile voisine. */
.lcg-halloween--cover .lcg-halloween__araignee { color:rgba(252,251,247,.42); }
.lcg-halloween--menu .lcg-halloween__araignee { color:rgba(36,16,46,.3); }
.lcg-halloween__araignee--haut { top:0; left:clamp(96px,15vw,176px); }
.lcg-halloween__araignee--bas { bottom:0; right:clamp(96px,15vw,176px); }
html.carte-doc .lcg-halloween { display:none !important; }
@media print { .lcg-halloween { display:none !important; } }
@media (prefers-reduced-motion: reduce) {
  html.fete-halloween-active .lcg-halloween { animation:none; }
}
  /* dans l'aperçu, les deux maquettes sont côte à côte : le décor reste
     dans son panneau au lieu de suivre la fenêtre */
  .lcg-halloween--menu { position:absolute; }
</style>
</head>
<body>
<header>
  <h1>Décor Halloween</h1>
  <p>Toiles d’angle ivoire sur la couverture, encre sur la carte — fenêtre du 24 octobre au 2 novembre.<br>
     Sur le site : <code>index.html?halloween=1</code> pour l’aperçu, <code>?fete=0</code> pour le masquer.</p>
</header>
