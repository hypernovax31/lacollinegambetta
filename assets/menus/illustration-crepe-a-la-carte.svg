<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Crêpe pliée</title>
  <desc id="desc">Illustration d'une crêpe dorée, pliée en triangle et servie sur une assiette.</desc>
  <defs>
    <linearGradient id="paper" x1="84" y1="48" x2="726" y2="562" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset=".52" stop-color="#FFF8E9"/>
      <stop offset="1" stop-color="#F4E6CA"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(404 286) rotate(90) scale(228 308)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF6" stop-opacity=".98"/>
      <stop offset="1" stop-color="#FFFDF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="183" y1="437" x2="618" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset=".48" stop-color="#F8EBC9"/>
      <stop offset="1" stop-color="#E6C67C"/>
    </linearGradient>
    <linearGradient id="crepe" x1="222" y1="107" x2="521" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5D7"/>
      <stop offset=".44" stop-color="#F3CF83"/>
      <stop offset="1" stop-color="#DDA64C"/>
    </linearGradient>
    <linearGradient id="fold" x1="222" y1="159" x2="582" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E6"/>
      <stop offset="1" stop-color="#EFC574"/>
    </linearGradient>
    <linearGradient id="chocolate" x1="281" y1="145" x2="533" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B452D"/>
      <stop offset="1" stop-color="#3F1E32"/>
    </linearGradient>
    <filter id="shadow" x="125" y="78" width="552" height="411" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#3D1E4F" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="131" y="405" width="538" height="102" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
  <rect width="800" height="600" fill="url(#halo)"/>
  <g opacity=".42" fill="#D8B257">
    <circle cx="117" cy="128" r="2"/><circle cx="155" cy="462" r="2"/><circle cx="658" cy="131" r="2"/>
    <circle cx="693" cy="416" r="2"/><circle cx="620" cy="506" r="1.5"/><circle cx="202" cy="93" r="1.5"/>
  </g>

  <ellipse cx="400" cy="470" rx="242" ry="26" fill="#563166" fill-opacity=".13" filter="url(#softShadow)"/>
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="450" rx="249" ry="45" fill="url(#plate)" stroke="#B98D3B" stroke-width="5"/>
    <ellipse cx="400" cy="442" rx="214" ry="29" fill="#FFFDF8" stroke="#E2C47A" stroke-width="3"/>
    <path d="M224 440c48-24 108-36 176-36 68 0 128 12 176 36-49 21-108 31-176 31-68 0-127-10-176-31Z" fill="#F5E3B7" opacity=".58"/>

    <!-- Crêpe triangulaire inspirée de la silhouette fournie : bord souple et plis en ruban. -->
    <path d="M155 164C219 116 285 84 354 70c68-14 130-9 191 14 53 20 97 48 126 80L469 408c-15 19-40 30-68 30s-53-11-69-30L155 164Z" fill="url(#crepe)" stroke="#59326E" stroke-width="10" stroke-linejoin="round"/>
    <path d="M157 164c68-23 141-37 218-41 106-6 205 14 296 60" stroke="#9B672E" stroke-width="8" stroke-linecap="round" opacity=".72"/>
    <path d="M166 171c63-13 128-20 194-20 111 0 207 22 285 66L463 409c-13 14-34 22-61 22-26 0-47-8-60-22L166 171Z" fill="url(#fold)" stroke="#FDEAB8" stroke-width="4" stroke-linejoin="round"/>

    <!-- Cœur de la crêpe : un pli chocolaté fluide, propre et lisible à petite taille. -->
    <path d="M300 174h198c22 0 32 26 15 40L351 306c-21 12-12 43 12 43h122c24 0 33 30 13 43l-100 66" stroke="url(#chocolate)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 174h198c22 0 32 26 15 40L351 306c-21 12-12 43 12 43h122c24 0 33 30 13 43l-100 66" stroke="#FFF6DE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M314 174h184c17 0 25 19 12 29L347 296c-28 16-16 65 16 65h122c17 0 24 21 9 31l-96 63" stroke="#5A306B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M244 160c19-16 42-31 70-43" stroke="#FFF6DB" stroke-width="12" stroke-linecap="round" opacity=".72"/>
    <path d="M510 119c42 12 79 30 111 55" stroke="#C78E3A" stroke-width="6" stroke-linecap="round" opacity=".58"/>
    <path d="M242 221c-14 56-3 106 31 151" stroke="#C98F3B" stroke-width="6" stroke-linecap="round" opacity=".52"/>
  </g>

  <g fill="#FFF9E9" stroke="#B98D3B" stroke-width="3" stroke-linejoin="round">
    <path d="m207 242 5 11 11 5-11 5-5 11-5-11-11-5 11-5 5-11Z"/>
    <path d="m584 307 4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9Z"/>
  </g>
</svg>
