<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Crêpe au Nutella et à la banane</title>
  <desc id="desc">Dessin au trait : une crêpe pliée nappée de chocolat noisette avec des rondelles de banane, servie sur une assiette.</desc>
  <g fill="none" stroke="#411559" stroke-linecap="round" stroke-linejoin="round">
    <!-- assiette -->
    <ellipse cx="100" cy="150" rx="54" ry="11" stroke-width="5.5"/>
    <path d="M48 154C54 164 76 168 100 168C124 168 146 164 152 154" stroke-width="4.5"/>
    <!-- crêpe pliée -->
    <path d="M52 118C56 92 76 78 100 78C124 78 144 92 148 118" stroke-width="6"/>
    <path d="M52 118C78 106 122 106 148 118" stroke-width="6"/>
    <!-- ruban de chocolat -->
    <path d="M74 112C85 107 93 114 102 111C111 108 118 112 124 110" stroke-width="4"/>
    <!-- rondelles de banane -->
    <g stroke-width="3.5">
      <circle cx="79" cy="98" r="7.5"/>
      <path d="M75 98H83"/>
      <circle cx="101" cy="91" r="7.5"/>
      <path d="M97 91H105"/>
      <circle cx="120" cy="98" r="7.5"/>
      <path d="M116 98H124"/>
    </g>
  </g>
</svg>
