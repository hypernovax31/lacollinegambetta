<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Logo La Colline Gambetta</title>
  <desc id="logo-description">Arbre stylisé violet et vert au-dessus d’un monogramme violet et or, dans un cercle clair bordé d’or.</desc>

  <defs>
    <clipPath id="circle-only">
      <circle cx="500" cy="500" r="493"/>
    </clipPath>
  </defs>

  <!-- Cercle propre : tout ce qui est extérieur reste transparent. -->
  <circle cx="500" cy="500" r="493" fill="#FCFAF7"/>
  <circle cx="500" cy="500" r="493" fill="none" stroke="#D0AC4D" stroke-width="8"/>
  <circle cx="500" cy="500" r="479" fill="none" stroke="#E8D9A7" stroke-width="2"/>

  <g clip-path="url(#circle-only)">
    <!-- Arbre principal : tronc et branches en violet profond -->
    <g fill="none" stroke="#481747" stroke-linecap="round" stroke-linejoin="round">
      <path d="M500 714 C500 650 501 580 500 514 C499 446 500 378 500 303" stroke-width="20"/>
      <path d="M500 535 C474 491 439 449 397 421 C368 402 342 383 318 357" stroke-width="12"/>
      <path d="M500 506 C531 466 567 432 610 403 C641 382 668 354 690 324" stroke-width="12"/>
      <path d="M500 430 C468 393 444 357 431 320 C422 294 418 270 420 245" stroke-width="10"/>
      <path d="M500 411 C532 377 555 343 568 306 C577 279 580 255 578 231" stroke-width="10"/>
      <path d="M500 353 C482 324 472 295 473 266 C474 246 478 228 485 211" stroke-width="8"/>
      <path d="M500 347 C520 320 531 291 531 264 C531 244 528 227 522 211" stroke-width="8"/>
    </g>

    <!-- Feuilles : formes pleines, sans points parasites -->
    <g fill="#5D8D2F" stroke="#5D8D2F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M485 227 C468 214 466 194 476 181 C492 190 496 208 485 227Z"/>
      <path d="M522 227 C535 210 553 207 566 217 C556 233 538 237 522 227Z"/>
      <path d="M437 276 C416 268 409 250 416 234 C436 238 446 256 437 276Z"/>
      <path d="M558 278 C578 267 597 273 605 289 C587 300 568 295 558 278Z"/>
      <path d="M399 328 C380 320 372 302 378 286 C398 290 407 307 399 328Z"/>
      <path d="M600 329 C619 318 638 324 646 341 C628 352 609 347 600 329Z"/>
      <path d="M359 382 C339 376 329 359 334 342 C354 345 365 362 359 382Z"/>
      <path d="M642 386 C662 376 681 383 688 400 C669 410 650 403 642 386Z"/>
      <path d="M408 421 C390 413 383 397 389 383 C407 386 416 402 408 421Z"/>
      <path d="M586 420 C604 411 621 417 628 433 C611 443 594 437 586 420Z"/>
      <path d="M466 326 C449 316 445 299 452 286 C469 290 476 308 466 326Z"/>
      <path d="M539 329 C554 318 571 321 579 335 C564 347 547 343 539 329Z"/>
    </g>

    <!-- Monogramme inférieur, fidèle au signe violet et or de l’original -->
    <g>
      <path d="M207 843 C222 781 268 727 328 706 C382 687 433 701 478 739 C432 748 384 779 346 830 C311 849 260 856 207 843Z" fill="#481747"/>
      <path d="M302 842 C341 793 384 754 437 731 C453 731 468 736 482 746 C430 757 385 791 354 835 C338 842 320 846 302 842Z" fill="#5B2057"/>
      <path d="M269 842 C314 818 355 776 386 731" fill="none" stroke="#FCFAF7" stroke-width="12" stroke-linecap="round"/>
      <text x="486" y="852" fill="#D0AC4D" font-family="Georgia, 'Times New Roman', serif" font-size="204" font-weight="500" letter-spacing="-12">G</text>
    </g>
  </g>

  <!-- Rebord final pour une découpe nette du cercle -->
  <circle cx="500" cy="500" r="493" fill="none" stroke="#D0AC4D" stroke-width="8"/>
</svg>
