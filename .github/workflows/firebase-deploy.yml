name: Mettre à jour les règles Firestore

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Déployer les règles Firestore du projet partagé
        run: npx firebase-tools deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only firestore --token "${{ secrets.FIREBASE_TOKEN }}"
