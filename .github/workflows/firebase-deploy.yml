name: Règles Firestore

# Déploie uniquement les règles et index Firestore, et seulement quand ces
# fichiers changent sur la branche principale. Le site lui-même est publié
# par GitHub Pages, sans workflow.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - package-lock.json
      - .github/workflows/firebase-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regles-firestore:
    name: Déployer les règles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Déployer les règles Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >-
          npx firebase-tools deploy
          --project "$FIREBASE_PROJECT_ID"
          --only firestore
          --token "$FIREBASE_TOKEN"
          --non-interactive
